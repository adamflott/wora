[package]
name = "linux-observability-mm"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
description = "Typed Linux memory-management readers extending procfs"
license = "MIT OR Apache-2.0"
authors = ["Adam Flott <adam@adamflott.com>"]
readme = "README.md"
keywords = ["linux", "memory", "procfs", "buddyinfo", "zoneinfo"]
categories = ["os::linux-apis"]

[features]
default = []
serde1 = ["dep:serde", "procfs-core/serde1"]

[target.'cfg(target_os = "linux")'.dependencies]
procfs-core = { version = "0.18", default-features = false }
serde = { version = "1", features = ["derive"], optional = true }
procfs = { version = "0.18", default-features = false }

[target.'cfg(target_os = "linux")'.dev-dependencies]
serde_json = "1"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
