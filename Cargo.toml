[package]
name = "wora"
authors = [ "Adam Flott <adam@adamflott.com>" ]
version = "0.0.18"
edition = "2024"
rust-version = "1.95"
description = "A framework for building applications (daemons, etc) that run in different environments (Linux, Kubernetes, etc)."
readme = "README.md"
repository = "https://github.com/adamflott/wora"
license = "MIT OR Apache-2.0"
categories = ["development-tools"]

[workspace]
members = [".", "wora-observability", "linux-observability-mm"]
resolver = "3"

[dependencies]
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env", "cargo" ] }
decimal-percentage = "0.1.4"
derive-getters = "0.5.0"
derive_builder = "0.20.2"
directories = "6.0.0"
libc = "0.2.190"
log = "0.4.34"
nix = { version = "0.31.3", features = ["process", "mman", "resource", "fs", "user"]}
notify = { version = "8.2.0", features = ["serde"] }
os_info = "3.15.0"
proc-lock = "0.4.0"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_derive = "1.0.229"
serde_json = "1.0.154"
sysinfo = "0.39.6"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[target.'cfg(target_os = "linux")'.dependencies]
caps = "0.5.5"
procfs = { version = "0.18.0", features = ["serde1"] }
sd-notify = "0.5.0"
linux-observability-mm = { path = "linux-observability-mm", version = "0.3.0", features = ["serde1"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
launchd = "0.3.0"
raunch = "1.0.1"

[build-dependencies]
pkg-config = "0.3.34"

[[example]]
name = "onboarding"
path = "examples/onboarding.rs"

[[example]]
name = "systemd_daemon"
path = "examples/systemd_daemon.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
opt-level = 3
debug = "none"
strip = "none"
debug-assertions = false
overflow-checks = false
lto = "fat"
panic = 'abort'
incremental = false
codegen-units = 1
rpath = false
